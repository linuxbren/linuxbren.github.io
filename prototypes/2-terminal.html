<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linuxbren — bren@omarchy</title>
<meta name="description" content="Open-source tools for Omarchy and Linux. Flight, AI, family.">
<style>
  :root{--bg:#1a1b26;--bar:#16161e;--fg:#c0caf5;--dim:#565f89;--acc:#9ece6a;--blue:#7aa2f7;--mag:#bb9af7;--yel:#e0af68;--red:#f7768e}
  *{box-sizing:border-box}
  body{margin:0;background:#0f0f14;color:var(--fg);font:15px/1.55 ui-monospace,"JetBrains Mono","Cascadia Mono",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
  a{color:var(--blue)}
  .win{width:100%;max-width:900px;height:min(78vh,720px);background:var(--bg);border:1px solid #2a2b3d;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
  .bar{background:var(--bar);padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--dim)}
  .bar i{width:11px;height:11px;border-radius:50%;background:#2a2b3d;display:inline-block}
  .bar span{margin-left:auto;margin-right:auto}
  #out{flex:1;overflow-y:auto;padding:14px 16px;white-space:pre-wrap;word-break:break-word}
  .line{margin:0}
  .p{color:var(--acc)} .d{color:var(--dim)} .h{color:var(--mag)} .y{color:var(--yel)}
  .chip{display:inline-block;border:1px solid #2a2b3d;border-radius:4px;padding:0 8px;margin:2px 4px 2px 0;color:var(--blue);cursor:pointer;background:transparent;font:inherit}
  .chip:hover{background:#24263a}
  form{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #2a2b3d;background:var(--bar)}
  form label{color:var(--acc);white-space:nowrap}
  input{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;min-width:0}
  .tip{color:var(--dim);font-size:.78rem;margin-top:14px;text-align:center;max-width:900px}
  table{border-collapse:collapse}td{padding:0 16px 0 0;vertical-align:top}
</style>
</head>
<body>
<div class="win" role="application" aria-label="Terminal-style site navigation">
  <div class="bar"><i></i><i></i><i></i><span>bren@omarchy: ~</span></div>
  <div id="out" aria-live="polite"></div>
  <form id="f"><label for="in">bren@omarchy ~ $</label><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></form>
</div>
<p class="tip">Type a command or tap a chip. <b>help</b> lists everything. Everything here also lives at <a href="https://github.com/linuxbren">github.com/linuxbren</a>.</p>

<noscript>
  <h2>linuxbren</h2>
  <p>Open-source tools for Omarchy and Linux.</p>
  <ul>
    <li><a href="https://github.com/linuxbren/flyover">flyover</a> — ADS-B radar scope in your terminal</li>
    <li><a href="https://github.com/linuxbren/flyover-pill">flyover-pill</a> — Omarchy bar widget</li>
    <li><a href="https://github.com/linuxbren/tidefiles">tidefiles</a> — terminal file manager</li>
  </ul>
</noscript>

<script>
const out=document.getElementById('out'),inp=document.getElementById('in'),f=document.getElementById('f');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chips=list=>list.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('');
const P={
 flyover:`<span class="h">flyover</span> <span class="d">v0.2.0 · Rust</span>
Real-time ADS-B radar scope in your terminal. Sixel or braille render,
fading trails, native Omarchy screensaver. Follows your live theme.
<span class="p">$</span> cargo install flyover
<a href="https://github.com/linuxbren/flyover">source</a> · <a href="https://crates.io/crates/flyover">crates.io</a>`,
 'flyover-pill':`<span class="h">flyover-pill</span> <span class="d">QML · Omarchy bar widget</span>
Ambient aircraft count in your bar. Left-click: scope. Right-click: screensaver.
<span class="p">$</span> omarchy plugin add https://github.com/linuxbren/flyover-pill.git --enable
<a href="https://github.com/linuxbren/flyover-pill">source</a>`,
 tidefiles:`<span class="h">tidefiles</span> <span class="d">Go · Bubble Tea</span>
Keyboard-first file manager. Three panes, inline image previews, trash + undo,
follows your Omarchy theme.
<span class="p">$</span> git clone https://github.com/linuxbren/tidefiles &amp;&amp; cd tidefiles &amp;&amp; go run .
<a href="https://github.com/linuxbren/tidefiles">source</a>`
};
const C={
 help:()=>`Commands:
<table><tr><td class="p">ls</td><td>list projects</td></tr><tr><td class="p">open &lt;name&gt;</td><td>details + install</td></tr><tr><td class="p">about</td><td>who is this</td></tr><tr><td class="p">likes</td><td>things I like</td></tr><tr><td class="p">x</td><td>recent posts</td></tr><tr><td class="p">links</td><td>where to find me</td></tr><tr><td class="p">clear</td><td>clear screen</td></tr></table>`,
 ls:()=>`<span class="d">drwxr-xr-x</span> projects/\n`+chips(['open flyover','open flyover-pill','open tidefiles'])+`\n<span class="d">planned:</span> colony-sim  wireframe-flight-sim`,
 whoami:()=>'linuxbren',
 about:()=>`<span class="h">linuxbren</span>
I build open-source tools for Omarchy and Linux. Flight, AI, and being a dad
of one are the things that keep me building.`,
 likes:()=>`<span class="y">✈</span> flight   <span class="y">▣</span> omarchy   <span class="y">🐧</span> linux   <span class="y">✦</span> ai   <span class="y">♥</span> family (dad of one)`,
 x:()=>`<span class="d">@YOUR_HANDLE on X — sample posts, replace with real ones</span>
<span class="p">›</span> shipped flyover 0.2.0: native Omarchy screensaver
<span class="p">›</span> reply: yes, it reads your live theme colors
<span class="p">›</span> tidefiles is up: three panes, image previews`,
 links:()=>`<a href="https://github.com/linuxbren">github.com/linuxbren</a>\n<a href="https://x.com/YOUR_HANDLE">x.com/YOUR_HANDLE</a>`,
 clear:()=>{out.innerHTML='';return null},
};
function print(html,cls=''){const d=document.createElement('div');d.className='line '+cls;d.innerHTML=html;out.appendChild(d);out.scrollTop=out.scrollHeight}
function run(raw){
  const cmd=raw.trim();print(`<span class="p">bren@omarchy ~ $</span> ${esc(cmd)}`);
  if(!cmd)return;
  const [c,...a]=cmd.split(/\s+/);
  if(c==='open'||c==='cat'){const n=a[0];return print(P[n]||`open: ${esc(n||'')}: no such project. try <b>ls</b>`)}
  if(C[c]){const r=C[c]();if(r!==null)print(r)}else print(`bash: ${esc(c)}: command not found. try <b>help</b>`,'d');
}
f.addEventListener('submit',e=>{e.preventDefault();run(inp.value);inp.value=''});
out.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){run(c.dataset.c);inp.focus()}});
print(`<span class="h">bren@omarchy</span> <span class="d">— open-source tools for Omarchy &amp; Linux</span>`);
print(`Type <b>help</b>, or start here:`);
print(chips(['ls','about','likes','x','links']));
run('ls');
</script>
</body>
</html>
